# mcp-terra CI — supply-chain hardened.
#
# Every third-party action is pinned to a full commit SHA (not a moving
# tag like @v4). The `ubuntu-22.04` runner is requested by exact version
# rather than `ubuntu-latest`. Dependency installation uses
# --require-hashes against requirements.lock so a compromised PyPI mirror
# cannot substitute a malicious wheel without producing a sha256 collision.
#
# Token policy: `permissions: contents: read` is set at the workflow level
# (least privilege). No secrets are referenced by this workflow. If a
# downstream job ever needs a secret, raise permissions on JUST that job.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR builds — saves runner minutes and prevents stale
# job results racing for the same PR status check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: security tests + lint + audit
    # Pinned to an exact runner image version. `ubuntu-latest` is a moving
    # target; if a future GitHub-hosted runner image changes default tool
    # versions our build could break silently.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # actions/checkout v4.2.2 — pinned by commit SHA.
      # Source: https://github.com/actions/checkout/releases/tag/v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.3.0 — pinned by commit SHA.
      # Source: https://github.com/actions/setup-python/releases/tag/v5.3.0
      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Install locked dependencies (--require-hashes)
        run: |
          python -m pip install --upgrade pip
          # --require-hashes refuses any wheel whose sha256 is not in
          # requirements.lock. This is the supply-chain anchor.
          pip install --require-hashes -r requirements.lock
          # Install the package itself with --no-deps (deps already locked).
          pip install --no-deps -e .

      - name: Install dev/audit tools
        run: |
          # ruff, pip-audit, detect-secrets are CI-only tools; not runtime deps.
          # Versions pinned for reproducibility.
          pip install \
              "ruff==0.7.4" \
              "pip-audit==2.7.3" \
              "detect-secrets==1.5.0"

      - name: Secret scan (detect-secrets) — fail fast
        run: |
          # Fail the build if ANY tracked file contains a credential not
          # acknowledged in .secrets.baseline. The baseline is generated by
          # `detect-secrets scan` and committed; a new token/key/password
          # anywhere in the tree fails CI before anything else runs. Run first
          # so a leaked secret never proceeds to build/test.
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Run security test suite
        run: |
          python tests/test_security_comprehensive.py

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/

      - name: Audit dependencies (pip-audit --strict)
        run: |
          # --strict turns warnings into failures (e.g. skipped audits).
          # If a CVE lands on a pinned dep, this job fails and the lock
          # file must be bumped.
          pip-audit --strict --requirement requirements.lock

      # anchore/sbom-action v0.17.8 — pinned by commit SHA.
      # Source: https://github.com/anchore/sbom-action/releases/tag/v0.17.8
      #
      # SBOM generation is best-effort: continue-on-error means a transient
      # action failure does not block a PR. The artifact (if produced) is
      # uploaded for later review.
      - name: Generate SBOM (SPDX)
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693
        with:
          path: .
          format: spdx-json
          artifact-name: mcp-terra-sbom.spdx.json
          output-file: ./mcp-terra-sbom.spdx.json

  docker-build:
    name: docker build (smoke)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: security-tests
    # Only build the image on push to main — saves runner time on PRs that
    # only touch tests/docs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build container (no push)
        run: |
          docker build -t mcp-terra:ci .

      - name: Smoke-test container starts
        run: |
          # The MCP speaks stdio; a real handshake needs a client. We just
          # verify the entrypoint imports cleanly under the unprivileged
          # user the Dockerfile drops to.
          docker run --rm --entrypoint python mcp-terra:ci -c "import mcp_terra.server"
