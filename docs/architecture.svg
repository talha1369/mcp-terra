<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-label="mcp-terra architecture and trust boundaries">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a4e"/>
      <stop offset="0.6" stop-color="#0a3f74"/>
      <stop offset="1" stop-color="#0b4a86"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#74ae43"/>
    </marker>
    <style>
      .t    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .box  { fill: #ffffff; fill-opacity: 0.05; stroke: #2f86c9; stroke-width: 1.5; }
      .hl   { fill: #74ae43; fill-opacity: 0.10; stroke: #74ae43; stroke-width: 1.8; }
      .h    { font-weight: 800; font-size: 19px; fill: #f5f9ff; }
      .s    { font-weight: 500; font-size: 14px; fill: #cfe0f2; }
      .lbl  { font-weight: 600; font-size: 11px; fill: #9fc0e0; }
      .arr  { stroke: #74ae43; stroke-width: 2; fill: none; opacity: 0.95; }
    </style>
  </defs>

  <rect width="1240" height="480" rx="18" fill="url(#abg)"/>
  <text x="36" y="46" class="t h" font-size="22">mcp-terra — architecture &amp; trust boundaries</text>
  <rect x="38" y="58" width="150" height="5" rx="2.5" fill="#74ae43"/>

  <!-- Agent (left) -->
  <rect class="box" x="40" y="112" width="212" height="92" rx="12"/>
  <text x="60" y="148" class="t h">AI agent</text>
  <text x="60" y="174" class="t s">any MCP-aware client</text>
  <text x="60" y="194" class="t s">(input = untrusted)</text>

  <!-- MCP core (middle, top) -->
  <rect class="hl" x="344" y="96" width="300" height="152" rx="12"/>
  <text x="364" y="128" class="t h">mcp-terra (local)</text>
  <text x="364" y="156" class="t s">• _pre() gate · writes-lock</text>
  <text x="364" y="178" class="t s">• safety.py · policy.py</text>
  <text x="364" y="200" class="t s">• append-only audit chain</text>
  <text x="364" y="222" class="t s">• kill-switch · rate limit · spend cap</text>

  <!-- on-VM runner + watchdog (middle, bottom) -->
  <rect class="hl" x="344" y="312" width="300" height="120" rx="12"/>
  <text x="364" y="344" class="t h">on-VM runner + watchdog</text>
  <text x="364" y="370" class="t s">• verifies HMAC sig + sha256</text>
  <text x="364" y="392" class="t s">• runs papermill · heartbeat</text>
  <text x="364" y="414" class="t s">• spend watchdog (crash-safe)</text>

  <!-- Terra REST (right, top) -->
  <rect class="box" x="868" y="96" width="332" height="66" rx="12"/>
  <text x="888" y="128" class="t h" font-size="17">Terra REST</text>
  <text x="888" y="149" class="t s">Rawls · Leonardo · Sam · Agora · Cromwell</text>

  <!-- GCS bucket (right, middle) -->
  <rect class="box" x="868" y="186" width="332" height="62" rx="12"/>
  <text x="888" y="216" class="t h" font-size="17">GCS workspace bucket</text>
  <text x="888" y="236" class="t s">allow-listed · no-clobber on every write</text>

  <!-- Jupyter VM (right, bottom) -->
  <rect class="box" x="868" y="330" width="332" height="86" rx="12"/>
  <text x="888" y="366" class="t h">Jupyter VM (Leonardo)</text>
  <text x="888" y="390" class="t s">stop / pause only — never deleted</text>

  <!-- arrows: labels CENTERED over each arrow span, well clear of the boxes -->
  <path class="arr" d="M252,158 H340" marker-end="url(#ah)"/>
  <text x="296" y="149" class="mono lbl" text-anchor="middle">MCP stdio</text>

  <path class="arr" d="M644,129 H864" marker-end="url(#ah)"/>
  <text x="754" y="120" class="mono lbl" text-anchor="middle">gcloud OAuth · user identity</text>

  <path class="arr" d="M644,217 H864" marker-end="url(#ah)"/>
  <text x="754" y="208" class="mono lbl" text-anchor="middle">HMAC-signed job spec</text>

  <path class="arr" d="M1034,326 V252" marker-end="url(#ah)"/>
  <text x="1048" y="292" class="mono lbl">polls 15s</text>

  <path class="arr" d="M600,310 V252" marker-end="url(#ah)"/>
  <text x="468" y="285" class="mono lbl" text-anchor="middle">result.json + log (signed)</text>

  <path class="arr" d="M644,373 H864" marker-end="url(#ah)"/>
  <text x="754" y="364" class="mono lbl" text-anchor="middle">stop / pause</text>

  <!-- safety seal: append-only strata (green→blue, matches the banner signature) -->
  <g transform="translate(146,316)">
    <rect x="-30" y="-22" width="60" height="9" rx="2" fill="#74ae43" opacity="0.95"/>
    <rect x="-34" y="-9"  width="68" height="9" rx="2" fill="#2f86c9" opacity="0.92"/>
    <rect x="-28" y="4"   width="56" height="9" rx="2" fill="#14507f" opacity="0.92"/>
    <text x="-46" y="-15" class="t" font-weight="800" font-size="14" fill="#74ae43">+</text>
    <text x="0" y="36" text-anchor="middle" class="mono lbl">no delete · no overwrite</text>
    <text x="0" y="53" text-anchor="middle" class="mono lbl">primitive anywhere</text>
  </g>
</svg>
