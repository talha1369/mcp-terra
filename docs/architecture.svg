<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-label="mcp-terra architecture and trust boundaries">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a4e"/>
      <stop offset="0.6" stop-color="#0a3f74"/>
      <stop offset="1" stop-color="#0b4a86"/>
    </linearGradient>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#74ae43"/>
    </marker>
    <style>
      .t    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .box  { fill: #ffffff; fill-opacity: 0.05; stroke: #2f86c9; stroke-width: 1.5; }
      .hl   { fill: #74ae43; fill-opacity: 0.10; stroke: #74ae43; stroke-width: 1.8; }
      .h    { font-weight: 800; font-size: 19px; fill: #f5f9ff; }
      .s    { font-weight: 500; font-size: 14px; fill: #cfe0f2; }
      .lbl  { font-weight: 600; font-size: 12.5px; fill: #9fc0e0; }
      .arr  { stroke: #74ae43; stroke-width: 2; fill: none; opacity: 0.95; }
    </style>
  </defs>

  <rect width="1120" height="500" rx="18" fill="url(#abg)"/>
  <text x="36" y="46" class="t h" font-size="22">mcp-terra — architecture &amp; trust boundaries</text>
  <rect x="38" y="58" width="150" height="5" rx="2.5" fill="#74ae43"/>

  <!-- Agent -->
  <rect class="box" x="36" y="100" width="210" height="92" rx="12"/>
  <text x="56" y="136" class="t h">AI agent</text>
  <text x="56" y="162" class="t s">any MCP-aware client</text>
  <text x="56" y="182" class="t s">(input = untrusted)</text>

  <!-- MCP core -->
  <rect class="hl" x="330" y="84" width="300" height="150" rx="12"/>
  <text x="350" y="116" class="t h">mcp-terra (local)</text>
  <text x="350" y="144" class="t s">• _pre() gate · writes-lock</text>
  <text x="350" y="166" class="t s">• safety.py · policy.py</text>
  <text x="350" y="188" class="t s">• append-only audit chain</text>
  <text x="350" y="210" class="t s">• kill-switch · rate limit · spend cap</text>

  <!-- Terra REST -->
  <rect class="box" x="752" y="84" width="332" height="66" rx="12"/>
  <text x="772" y="116" class="t h" font-size="17">Terra REST</text>
  <text x="772" y="137" class="t s">Rawls · Leonardo · Sam · Agora · Cromwell</text>

  <!-- GCS bucket -->
  <rect class="box" x="752" y="174" width="332" height="60" rx="12"/>
  <text x="772" y="204" class="t h" font-size="17">GCS workspace bucket</text>
  <text x="772" y="224" class="t s">allow-listed · no-clobber on every write</text>

  <!-- Runner + watchdog -->
  <rect class="hl" x="330" y="304" width="300" height="120" rx="12"/>
  <text x="350" y="336" class="t h">on-VM runner + watchdog</text>
  <text x="350" y="362" class="t s">• verifies HMAC sig + sha256</text>
  <text x="350" y="384" class="t s">• runs papermill · heartbeat</text>
  <text x="350" y="406" class="t s">• spend watchdog (crash-safe)</text>

  <!-- Jupyter VM -->
  <rect class="box" x="752" y="322" width="332" height="84" rx="12"/>
  <text x="772" y="356" class="t h">Jupyter VM (Leonardo)</text>
  <text x="772" y="380" class="t s">stop / pause only — never deleted</text>

  <!-- arrows (monospace labels = technical instrument), Terra-green -->
  <path class="arr" d="M246,146 H326" marker-end="url(#ah)"/>
  <text x="252" y="136" class="mono lbl">MCP stdio</text>

  <path class="arr" d="M630,124 H748" marker-end="url(#ah)"/>
  <text x="636" y="114" class="mono lbl">gcloud OAuth (user identity)</text>

  <path class="arr" d="M630,200 H748" marker-end="url(#ah)"/>
  <text x="636" y="190" class="mono lbl">HMAC-signed job spec</text>

  <path class="arr" d="M820,234 V318" marker-end="url(#ah)"/>
  <text x="828" y="280" class="mono lbl">polled 15s</text>

  <path class="arr" d="M540,304 V240 H636" marker-end="url(#ah)"/>
  <text x="350" y="274" class="mono lbl">result.json + log (signed)</text>

  <path class="arr" d="M630,364 H748" marker-end="url(#ah)"/>
  <text x="636" y="354" class="mono lbl">stop / pause</text>

  <!-- safety seal: append-only strata (green→blue, matches the banner signature) -->
  <g transform="translate(150,300)">
    <rect x="-30" y="-22" width="60" height="9" rx="2" fill="#74ae43" opacity="0.95"/>
    <rect x="-34" y="-9"  width="68" height="9" rx="2" fill="#2f86c9" opacity="0.92"/>
    <rect x="-28" y="4"   width="56" height="9" rx="2" fill="#14507f" opacity="0.92"/>
    <text x="-46" y="-15" class="t" font-weight="800" font-size="14" fill="#74ae43">+</text>
    <text x="0" y="36" text-anchor="middle" class="mono lbl">no delete · no overwrite</text>
    <text x="0" y="53" text-anchor="middle" class="mono lbl">primitive anywhere</text>
  </g>
</svg>
